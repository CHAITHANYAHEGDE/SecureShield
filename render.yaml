services:
  - type: web
    name: secureshield-api
    env: python
    buildCommand: "python -m pip install --upgrade pip setuptools wheel && python -m pip install --no-build-isolation ."
    startCommand: "PYTHONPATH=src uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: SECURESHIELD_FRONTEND_URL
        sync: false
      - key: SECURESHIELD_DATASET
        value: "data/raw/MalMem2022_Binary_Clean.csv"
