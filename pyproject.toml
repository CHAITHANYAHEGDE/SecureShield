[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "secureshield"
version = "0.1.0"
description = "SecureShield: Intelligent Malware Analysis and Incident Correlation Framework"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Chaithanya Hegde", email = "" }
]
requires-python = ">=3.11"
dependencies = [
    # Core scientific stack
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",

    # Machine Learning
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "catboost>=1.2.0",
    "imbalanced-learn>=0.11.0",

    # Hyperparameter Optimization
    "optuna>=3.2.0",

    # Explainable AI
    "shap>=0.42.0",
    "lime>=0.2.0",

    # Schema validation
    "pydantic>=2.0.0",

    # Graph analysis
    "networkx>=3.0",

    # Visualization
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.14.0",

    # Dashboard
    "streamlit>=1.28.0",

    # Statistical validation
    "statsmodels>=0.14.0",

    # Configuration
    "pyyaml>=6.0",

    # CLI
    "click>=8.1.0",

    # Utilities
    "tabulate>=0.9.0",
    "joblib>=1.3.0",
    "tqdm>=4.65.0",

    # Backend
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]
streaming = [
    "capymoa>=0.13.0",
    "modAL-python>=0.4.2",
]

[project.scripts]
secureshield = "secureshield.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I", "N", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
